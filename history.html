<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access History</title>

    <style>
        body {
            background: #101827;
            font-family: Arial, sans-serif;
            color: white;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #60a5fa;
        }

        .container {
            background: white;
            color: #222;
            padding: 25px;
            border-radius: 12px;
            max-width: 1000px;
            margin: 40px auto;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #174ea6;
            color: white;
        }

        tr:nth-child(even) {
            background: #f1f5f9;
        }

        .btn {
            display: inline-block;
            padding: 12px 18px;
            margin: 15px 5px;
            background: #174ea6;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .btn:hover {
            background: #103b80;
        }

        .actions {
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>Access History</h1>

    <div class="container">

        <table>
            <tr>
                <th>Username</th>
                <th>Role</th>
                <th>Resource</th>
                <th>Risk Score</th>
                <th>Decision</th>
            </tr>

            <tbody id="historyRows"><tr><td colspan="5">No access records found.</td></tr></tbody>
        </table>

        <div class="actions">
            <a class="btn" href="#" id="downloadCsv">
                Download Access History (CSV)
            </a>

            <a class="btn" href="dashboard.html">
                Back to Dashboard
            </a>
        </div>

    </div>

<script src="script.js"></script>
</body>
</html>
