<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>

    <style>
        body {
            background: #101827;
            font-family: Arial, sans-serif;
            color: white;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #60a5fa;
        }

        .container {
            background: white;
            color: #222;
            max-width: 800px;
            margin: 40px auto;
            padding: 25px;
            border-radius: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #174ea6;
            color: white;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #174ea6;
        }
    </style>
</head>

<body>

    <h1>User Management</h1>

    <div class="container">

        <table>
            <tr>
                <th>Username</th>
                <th>Role</th>
                <th>Status</th>
            </tr>

            <tr>
                <td>admin</td>
                <td>Administrator</td>
                <td>Active</td>
            </tr>

            <tr>
                <td>manager</td>
                <td>Manager</td>
                <td>Active</td>
            </tr>

            <tr>
                <td>employee</td>
                <td>Employee</td>
                <td>Active</td>
            </tr>
        </table>

        <a href="dashboard.html">Back to Dashboard</a>

    </div>

<script src="script.js"></script>
</body>
</html>
